#docker/compose/config/redis/redis.conf
# Redis configuration for AI Trading System
port 6379
bind 0.0.0.0

# Memory management
maxmemory 512mb
maxmemory-policy allkeys-lru

# Persistence
save 900 1
save 300 10
save 60 10000

# Security (minimal for development)
protected-mode no

# Performance
tcp-keepalive 300
timeout 0
tcp-backlog 511

# Logging
loglevel notice
logfile ""

# Clients
maxclients 10000

# Lua scripting
lua-time-limit 5000