version: "3.9"

networks:
  trading_net:
    driver: bridge

x-restart: &restart_policy
  restart: unless-stopped

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: ai_trading_timescaledb
    environment:
      POSTGRES_DB: trading_system
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data:rw
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d trading_system || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 2g
    <<: *restart_policy
    networks:
      - trading_net

redis:
    image: redis:7.2-alpine
    container_name: ai_trading_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data:rw
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    <<: *restart_policy
    networks:
      - trading_net

redis_commander:
    image: rediscommander/redis-commander:latest
    container_name: ai_trading_redis_commander
    environment:
      REDIS_HOSTS: "local:redis:6379"
      HTTP_USER: admin
      HTTP_PASS: admin
    ports:
      - "8081:8081"
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          memory: 256M
    <<: *restart_policy
    networks:
      - trading_net

postgres_exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: ai_trading_postgres_exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://user:password@timescaledb:5432/trading_system?sslmode=disable"
    depends_on:
      - timescaledb
    ports:
      - "9187:9187"
    <<: *restart_policy
    networks:
      - trading_net

redis_exporter:
    image: oliver006/redis_exporter:latest
    container_name: ai_trading_redis_exporter
    command:
      - --redis.addr=redis:6379
    depends_on:
      - redis
    ports:
      - "9121:9121"
    <<: *restart_policy
    networks:
      - trading_net

node_exporter:
    image: prom/node-exporter:latest
    container_name: ai_trading_node_exporter
    ports:
      - "9100:9100"
    <<: *restart_policy
    networks:
      - trading_net

prometheus:
    image: prom/prometheus:latest
    container_name: ai_trading_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - node_exporter
      - postgres_exporter
      - redis_exporter
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    <<: *restart_policy
    networks:
      - trading_net

grafana:
    image: grafana/grafana:latest
    container_name: ai_trading_grafana
    ports:
      - "3000:3000"
    volumes:
      - grafanadata:/var/lib/grafana:rw
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    <<: *restart_policy
    networks:
      - trading_net

market_data_agent:
    build: ../../                               # adjust to your repository root if necessary
    container_name: ai_trading_market_agent
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_NAME: trading_system
      DB_USER: user
      DB_PASSWORD: password
      REDIS_HOST: redis
      REDIS_PORT: 6379
    deploy:
      resources:
        limits:
          memory: 1g
    <<: *restart_policy
    networks:
      - trading_net

volumes:
  pgdata:
  redisdata:
  grafanadata:
